name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.21 - 分镜摄影与放大编辑'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.21 为分镜表和视频节点加入可直接作用于提示词的摄影设置，支持分镜内容与台词全屏编辑，并改善引用素材、中文手写和生成任务处理。

            ## 🎬 分镜与摄影

            - 分镜表支持整表摄影默认与单镜逐项覆盖，可选择摄影机、镜头、效果、焦段、拍摄光圈和更多参数；下拉提供常用拍摄场景及搭配提示，选择后自动加入生成提示词。
            - 视频节点复用同一套摄影设置，可跟随引用镜头或单独覆盖，并预览摄影提示词；原有摄影参数继续兼容。器材名称是画面风格参考，不改变模型实际输出的分辨率、比例或帧率。
            - 双击分镜表的内容或台词，可在全屏编辑器中放大编辑，支持编辑、预览、分栏及 @ 素材引用。MCP 创建的分镜表默认加宽，容纳摄影和原有列。

            ## ✍️ 画布与素材编辑

            - 引用胶囊右键可替换或删除；角色参考图支持鼠标拖拽调整顺序。
            - 画布笔记的手写选项内置小赖中文手写体，随应用分发 OFL 1.1 授权文件。
            - 图片节点切换模型时优先保留兼容的比例、分辨率等参数，仅在新模型不支持时调整。
            - 人物三视图＋双面部特写预设的下排正侧背视图统一从颈根裁切至脚底，并要求等比例对齐；五视图布局优先于肖像背景和构图要求。

            ## 🔄 生成与同步

            - 改进媒体接口明确失败和状态未知的区分，以及失败任务清理；网关超时等无法确认上游状态的情况仍需先核对原任务，不自动重复提交生成。
            - 项目资产云同步增加 HTTP Endpoint 兼容，并修复分片上传超时处理；HTTP 不加密传输，请仅用于可信网络。

            ## ⚠️ 升级与兼容性

            - 数据库维持 v26。升级前请导出重要项目并备份应用数据；安装旧程序不等于回退数据。
            - 云同步仍为项目资产的手动同步，不共享全局资产、不自动监听或传播本地删除。真实云端同步、模型摄影效果以及各平台安装升级仍需实际环境验收。
            - Windows 旧款无 AVX／AVX2 CPU 请使用 Legacy 包；Legacy 不包含本地 ONNX 和自动更新。
            - macOS 仅提供 Apple Silicon 包，采用临时签名、未经 Apple 公证；首次打开方式见[安装说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
