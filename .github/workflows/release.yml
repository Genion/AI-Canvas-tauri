name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.9.20 - 火山方舟计费账本与画布连线增强'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.9.20 新增火山方舟本地计费与用量账本（桌面版），可记录并导出图像/视频生成的用量与费用；画布大幅增强多节点连线、连线删除与上游图片预览，并支持宫格分镜自定义行列、视频节点连线下游可选类型与连线选择时保持显示；角色栏支持拖拽排序与弹簧动效，MCP 补齐角色参考音频与参考图绑定接口，编辑器改为 Shift+Enter 发送、Enter 换行。同时修复火山方舟虚拟人像库页面显示与上传、视频节点尺寸与时长解析、工作流批量生成串行执行等问题。

            ## 🧩 火山方舟（计费与用量）

            - 新增本地火山方舟计费与用量账本（仅桌面版）：Rust 计费子系统支持 SQLite 存储与 xlsx 导出，前端提供计费估算与账本管理组件，并在 AI 节点对话框与 API Key 设置中接入；图像/视频生成与轮询恢复时写入计费记录，保留历史价格快照并对错误信息脱敏。

            ## 🎨 画布（连线与分镜）

            - 完善多节点连线：框选至少两个可连接节点时显示批量连接手柄，可一次创建目标节点及全部连线，支持 Esc 取消并锁定源节点与项目，批量写入只产生一次可撤销历史。
            - 连线悬浮 1 秒后显示剪刀按钮删除对应连线；单选节点支持 F2 进入名称编辑。
            - 上游图片预览：缩略图调整为 48×48，悬浮显示仅含图片的放大预览，右上角提供断线按钮。
            - 宫格分镜支持自定义行与列数量创建。
            - 视频节点连线下游可选类型补全；连线存在选择框时先不消失。
            - 隔离节点弹窗特效错误并支持编辑器恢复；工作流批量生成改为按节点编号串行执行。

            ## 📺 剧集与资产

            - 角色栏新增拖拽排序与弹簧动效。
            - 修复抽屉态资产标签栏挤压与溢出滚动，并支持抽屉内按 Tab 收起、隐藏页签滚动条。
            - 优化剧集资产卡片缩略图与紧凑操作栏布局。

            ## 🔌 MCP

            - 补齐角色参考音频与参考图绑定接口。
            - 修复分镜时长与媒体生成参数映射。

            ## 💬 编辑器

            - 改为 Shift+Enter 发送、Enter 换行，并同步更新提示文案。

            ## 🐛 修复

            - 火山方舟：修复虚拟人像库管理页面显示不全、上传素材无响应、上传后无法更改素材名称。
            - 视频：按视频短边自适应节点尺寸；修正火山直连时长解析为按模型归一化。

            ## ⚠️ 升级与兼容性

            - 升级后已有插件会在首次加载时补全源码摘要，无需重新安装。
            - 私有注册表目录（`plugin-private`）被用户手动删除时，已有插件会停用并要求重新安装；这是预期的失败关闭行为，不会从浏览器存储静默恢复。
            - RunningHub 与 AutoDL 工作流需要配置对应的服务地址与凭据。
            - Blender 原生运行时需要本机已安装 Blender，且需授权项目目录。
            - Windows 旧款 CPU（不支持 AVX/AVX2）请使用名称含 `Legacy` 的安装包；该版本不包含本地 ONNX 功能。
            - 本地语音转文本依赖桌面端 ONNX 运行时；Intel Mac 和 Windows Legacy 安装包不包含该功能。
            - 视频剪辑器依赖本地编解码能力，实际可用导出编码格式取决于本机编解码器。
            - 浏览器模式无法使用桌面端凭据存储，API Key 仅在当前会话有效，重启后需要重新填写。
            - 视频剪辑窗口、应用内 ComfyUI、MCP 控制桥、长按圆环和本地文件导出仅在桌面版可用。
            - 火山方舟本地计费与用量账本为桌面（Tauri）功能，依赖新增的本地 SQLite 与 xlsx 导出能力，浏览器模式不支持。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`；该版本不包含本地 ONNX 功能。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }
